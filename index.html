<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Component Example</title>
    <!-- Load html-include.js early in <head> to prevent FOUC/flashing -->
    <script src="html-include.js"></script>
</head>
<body>

<!--
  HTML INCLUDE HEADER SLOT
  - src: path to the partial
  - min-height: reserves vertical space to prevent layout shift (CLS)
  - fade: smooth fade-in transition on load
  - allow-scripts is intentionally omitted because this partial has no scripts;
    only enable it for trusted partials that need JavaScript execution
-->
<html-include src="partials/header.html" min-height="65px" fade>
    <!-- Initial fallback content, also shown if JavaScript is unavailable -->
    <div class="skeleton-header">Loading Header...</div>
</html-include>
</body>
</html>
